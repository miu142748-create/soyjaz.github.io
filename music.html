<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>soy jaz | music player</title>
   <!-- Butterfly Favicon -->
   <link rel="icon" href="https://images.emojiterra.com/google/android-12l/512px/1f98b.png" type="image/png">
   <!-- Import Quicksand and Press Start 2P Fonts -->
   <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
   <link rel="stylesheet" href="style.css">
   
   <style>
       body {
           background-image: url('background.gif');
           background-size: cover;
           background-position: center;
           background-repeat: no-repeat;
           background-attachment: fixed;
       }

       /* Y2K Styled Native Audio Player */
       audio {
           width: 100%;
           max-width: 500px;
           margin: 15px 0;
           border-radius: 8px;
           outline: none;
       }

       /* Caption Display Container */
       .caption-box {
           background: rgba(0, 0, 0, 0.6);
           border: 1px dashed #ff99e6;
           border-radius: 8px;
           padding: 15px;
           margin-top: 15px;
           min-height: 60px;
           display: flex;
           align-items: center;
           justify-content: center;
           text-align: center;
       }

       .caption-text {
           font-family: 'Quicksand', sans-serif;
           font-size: 15px;
           font-weight: 700;
           color: #ff99e6;
           line-height: 1.4;
       }
   </style>
</head>
<body>

   <!-- Glitter Header -->
   <div style="margin-top: 25px; margin-bottom: 20px; text-align: center;" aria-hidden="true">
       <img src="https://text.glitter-graphics.net/heart/m.gif" alt="" border="0"><img src="https://text.glitter-graphics.net/heart/u.gif" alt="" border="0"><img src="https://text.glitter-graphics.net/heart/s.gif" alt="" border="0"><img src="https://text.glitter-graphics.net/heart/i.gif" alt="" border="0"><img src="https://text.glitter-graphics.net/heart/c.gif" alt="" border="0">
   </div>

   <div class="wrapper">

       <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;">jazzie terrell - Music Player</h1>

       <!-- Back to Home Button -->
       <div class="box" style="text-align: center;">
           <a class="pdf-button" href="index.html" aria-label="Return to homepage">
               [ BACK TO HOME ]
           </a>
       </div>

       <!-- Music Player Box -->
       <div class="box" style="text-align: center;">
           <p style="margin-top: 0; color: #ff80df; font-weight: 700; font-size: 16px;">✨ Now Playing: Track Title ✨</p>

           <!-- Native HTML5 Audio Player with WebVTT Track -->
           <audio id="audio-player" controls preload="metadata">
               <source src="your-audio-file.mp3" type="audio/mpeg">
               <track id="audio-track" kind="subtitles" src="captions.vtt" srclang="en" label="English Captions" default>
               Your browser does not support the audio element.
           </audio>

           <!-- Live Captions Screen Area -->
           <div class="caption-box" aria-live="polite">
               <span id="caption-display" class="caption-text">[ Captions will appear here when playing ]</span>
           </div>
       </div>

       <!-- Accessible Transcript Box (Best Practice for WCAG 2.2) -->
       <div class="box">
           <p style="margin-top: 0; color: #ff80df; font-weight: 700; font-size: 15px; text-align: center;">📜 Full Audio Transcript</p>
           <p style="font-size: 13px; line-height: 1.6; color: #ffffff; margin: 0;">
               <strong>[00:00]</strong> [Upbeat Y2K electronic synth intro plays]<br>
               <strong>[00:05]</strong> Welcome to my audio showcase page!<br>
               <strong>[00:10]</strong> ♪ Singing along to the rhythm of the track ♪
           </p>
       </div>

   </div>

   <!-- Script to extract and render track cues into the caption box -->
   <script>
       document.addEventListener('DOMContentLoaded', () => {
           const audio = document.getElementById('audio-player');
           const track = document.getElementById('audio-track');
           const captionDisplay = document.getElementById('caption-display');

           if (track && track.track) {
               // Show active text cue on screen as audio plays
               track.track.oncuechange = function () {
                   const activeCue = this.activeCues[0];
                   if (activeCue) {
                       captionDisplay.textContent = activeCue.text;
                   } else {
                       captionDisplay.textContent = '...';
                   }
               };
           }
       });
   </script>

</body>
</html>
