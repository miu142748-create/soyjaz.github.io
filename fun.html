<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun & Accessible Audio</title>
  <style>
    /* Screen Reader Only Utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .accessible-player-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .player-container {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .track-meta {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-weight: 700;
      font-size: 1.125rem;
      color: #f8fafc;
    }

    .track-artist {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    button, input[type="range"] {
      outline: none;
    }

    button:focus-visible, input[type="range"]:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 3px;
    }

    .control-btn {
      background: #334155;
      border: 2px solid #f8fafc;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #f8fafc;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: #475569;
    }

    .progress-container {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: #cbd5e1;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      height: 8px;
      cursor: pointer;
    }

    .volume-container {
      width: 80px;
      display: flex;
      align-items: center;
    }

    .back-link {
      margin-top: 2rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>WCAG 2.2 Audio Component</h1>
  <p class="subtitle">Fully accessible, keyboard-operable custom audio player.</p>

  <section class="accessible-player-wrapper" aria-labelledby="player-heading">
    <h2 id="player-heading" class="sr-only">Audio Player: Ambient Focus Track</h2>

    <div class="player-container" role="region" aria-label="Music Player Controls">
      
      <div class="track-meta">
        <span class="track-title" id="track-name">Ambient Flow State</span>
        <span class="track-artist">Open-Access Track</span>
      </div>

      <audio id="audio-element" preload="metadata">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>

      <div class="controls-row">
        
        <button id="play-btn" class="control-btn" aria-label="Play" aria-pressed="false" aria-controls="audio-element">
          <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <div class="progress-container">
          <span id="current-time" aria-hidden="true">0:00</span>
          
          <label for="seek-slider" class="sr-only">Seek Audio Progress</label>
          <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent elapsed">
          
          <span id="duration" aria-hidden="true">0:00</span>
        </div>

        <button id="mute-btn" class="control-btn" aria-label="Mute Audio" aria-pressed="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <div class="volume-container">
          <label for="volume-slider" class="sr-only">Volume Control</label>
          <input type="range" id="volume-slider" min="0" max="1" value="1" step="0.01" aria-label="Volume">
        </div>

      </div>

      <div id="sr-announcements" class="sr-only" aria-live="polite"></div>

    </div>
  </section>

  <a href="index.html" class="back-link">← Return Home</a>

  <script>
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const muteBtn = document.getElementById('mute-btn');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const srAnnouncements = document.getElementById('sr-announcements');

    const playIcon = playBtn.querySelector('.icon-play');
    const pauseIcon = playBtn.querySelector('.icon-pause');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      seekSlider.max = audio.duration;
    });

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        playBtn.setAttribute('aria-label', 'Pause');
        playBtn.setAttribute('aria-pressed', 'true');
        srAnnouncements.textContent = "Audio playing";
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        playBtn.setAttribute('aria-label', 'Play');
        playBtn.setAttribute('aria-pressed', 'false');
        srAnnouncements.textContent = "Audio paused";
      }
    }

    playBtn.addEventListener('click', togglePlay);

    audio.addEventListener('timeupdate', () => {
      seekSlider.value = audio.currentTime;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      const progressPercent = Math.round((audio.currentTime / audio.duration) * 100) || 0;
      seekSlider.setAttribute('aria-valuetext', `${progressPercent} percent elapsed`);
    });

    seekSlider.addEventListener('input', () => {
      audio.currentTime = seekSlider.value;
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      if (audio.muted) {
        muteBtn.setAttribute('aria-pressed', 'true');
        muteBtn.setAttribute('aria-label', 'Unmute Audio');
        srAnnouncements.textContent = "Audio muted";
      } else {
        muteBtn.setAttribute('aria-pressed', 'false');
        muteBtn.setAttribute('aria-label', 'Mute Audio');
        srAnnouncements.textContent = "Audio unmuted";
      }
    });
  </script>
</body>
</html>
