<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music & Media Showcase - Pyramids</title>
  <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAXIpcAHPR/wBhq/8ALk8uAL/w8gBksv8AdLX/ANL7/ACn6u0AQmNCADpc+wCp4/8ATW5NAFCD/gAAAAAAC7u7tEu7u7C7u7u6S7u7u7u7u7pLu7u77u7u6k7u7u7u7uqqTu7u7nd3qqpDMzN3czPaNKSjMzcjM9E9oaoiIiJj0z1DFCIiIiLSLUIUIiLMzMzNTMrMzJmZmZ1JnZmZmZmZkdmZmZmZmZmZmZmZmmVVVVVVVVVVVCIiIiIiIiICAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAQAA" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Custom Audio Player Styles */
    .audio-player-card {
      background: #1e1e24;
      border: 2px solid #ff80df;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      margin: 20px auto;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 128, 223, 0.2);
      box-sizing: border-box;
    }
    .track-info {
      text-align: center;
      margin-bottom: 15px;
    }
    .track-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #ff80df;
      margin-bottom: 4px;
    }
    .track-artist {
      font-size: 0.9rem;
      color: #cccccc;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .btn-control {
      background: #ff80df;
      color: #121212;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.1s ease, background-color 0.2s ease;
      flex-shrink: 0;
    }
    .btn-control:hover, .btn-control:focus {
      background: #ffffff;
      outline: 2px solid #ff80df;
      outline-offset: 2px;
    }
    .btn-control:active {
      transform: scale(0.95);
    }
    .time-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 15px;
    }
    .slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      accent-color: #ff80df;
      cursor: pointer;
      min-width: 0;
    }
    /* Compact Volume Section */
    .volume-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 5px;
      border-top: 1px solid #2a2a32;
    }
    .btn-volume {
      background: transparent;
      border: 1px solid #ff80df;
      color: #ff80df;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .btn-volume:hover, .btn-volume:focus {
      background: rgba(255, 128, 223, 0.2);
    }
    .volume-label {
      font-size: 0.75rem;
      color: #aaaaaa;
    }
    .volume-slider {
      width: 70px;
      height: 4px;
      accent-color: #ff80df;
      cursor: pointer;
    }
    /* Lyrics Accordion */
    .lyrics-section {
      margin-top: 15px;
      border-top: 1px solid #333;
      padding-top: 10px;
    }
    .lyrics-toggle {
      background: transparent;
      border: 1px solid #ff80df;
      color: #ff80df;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      text-align: left;
    }
    .lyrics-toggle:hover, .lyrics-toggle:focus {
      background: rgba(255, 128, 223, 0.1);
    }
    .lyrics-content {
      display: none;
      padding: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #dddddd;
      white-space: pre-line;
    }
    .lyrics-content.open {
      display: block;
    }
    /* YouTube Embed Container */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #333;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    /* Screen Reader Only Utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    
    <header style="text-align: center; margin-bottom: 30px;">
      <h1 style="color: #ff80df; margin-bottom: 10px;">Media Showcase</h1>
      <a class="pdf-button" href="index.html" aria-label="Return to homepage">[ BACK TO HOME ]</a>
    </header>

    <!-- Hidden iframe for background audio playback -->
    <div id="audio-player-container" class="hidden-player"></div>

    <!-- Custom Audio Player Card -->
    <section aria-labelledby="audio-player-heading">
      <h2 id="audio-player-heading" class="sr-only">Audio Player</h2>
      
      <div class="audio-player-card">
        <div class="track-info">
          <div class="track-title" id="track-title">Pyramids (Instrumental)</div>
          <div class="track-artist" id="track-artist">Frank Ocean</div>
        </div>

        <div class="controls-row">
          <button id="play-pause-btn" class="btn-control" aria-label="Play Track" aria-pressed="false">▶</button>
        </div>

        <div class="time-row">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-slider" class="slider" value="0" min="0" max="100" step="1" aria-label="Audio Seek Slider" aria-valuetext="0 percent elapsed">
          <span id="total-duration">0:00</span>
        </div>

        <!-- Compact volume control fitting neatly within card bounds -->
        <div class="volume-row">
          <button id="mute-btn" class="btn-volume" aria-label="Mute Audio" aria-pressed="false">🔊</button>
          <label for="volume-slider" class="volume-label">Vol</label>
          <input type="range" id="volume-slider" class="volume-slider" value="100" min="0" max="100" step="1" aria-label="Volume Slider">
        </div>

        <!-- Lyrics Accordion -->
        <div class="lyrics-section">
          <button id="lyrics-toggle-btn" class="lyrics-toggle" aria-expanded="false" aria-controls="lyrics-panel">
            📜 Toggle Lyrics / Notes
          </button>
          <div id="lyrics-panel" class="lyrics-content" role="region" aria-labelledby="lyrics-toggle-btn">
            [Pyramids - Instrumental Track]
            
            Part I: Ancient Egypt & Royalty
            Part II: Modern Era & Transformation
          </div>
        </div>
      </div>
    </section>

    <!-- Featured YouTube Video Section -->
    <section aria-labelledby="youtube-section-heading" style="margin-top: 40px;">
      <h2 id="youtube-section-heading" style="color: #ff80df; text-align: center;">Featured Video: Pyramids</h2>
      
      <div class="video-container">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/G678nf7U6as" 
          title="Frank Ocean - Pyramids" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <!-- ARIA Live Region for Screen Reader Announcements -->
    <div id="sr-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  </div>

  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let updateTimer;
    let isMuted = false;

    const playPauseBtn = document.getElementById('play-pause-btn');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const muteBtn = document.getElementById('mute-btn');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const lyricsPanel = document.getElementById('lyrics-panel');
    const lyricsToggleBtn = document.getElementById('lyrics-toggle-btn');
    const srAnnouncements = document.getElementById('sr-announcement');

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('audio-player-container', {
        height: '0',
        width: '0',
        videoId: 'G678nf7U6as',
        playerVars: {
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      const duration = player.getDuration();
      totalDurationEl.textContent = formatTime(duration);
      seekSlider.max = Math.floor(duration);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        playPauseBtn.textContent = '⏸';
        playPauseBtn.setAttribute('aria-label', 'Pause Track');
        playPauseBtn.setAttribute('aria-pressed', 'true');
        srAnnouncements.textContent = "Playing Pyramids Instrumental";
        startTimer();
      } else {
        playPauseBtn.textContent = '▶';
        playPauseBtn.setAttribute('aria-label', 'Play Track');
        playPauseBtn.setAttribute('aria-pressed', 'false');
        if (event.data === YT.PlayerState.PAUSED) {
          srAnnouncements.textContent = "Audio paused";
        }
        stopTimer();
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(() => {
        if (player && player.getCurrentTime) {
          const current = player.getCurrentTime();
          const duration = player.getDuration();
          seekSlider.value = Math.floor(current);
          currentTimeEl.textContent = formatTime(current);
          const progressPercent = Math.round((current / duration) * 100) || 0;
          seekSlider.setAttribute('aria-valuetext', `${progressPercent} percent elapsed`);
        }
      }, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    playPauseBtn.addEventListener('click', () => {
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (player && player.seekTo) {
        player.seekTo(seekSlider.value, true);
        currentTimeEl.textContent = formatTime(seekSlider.value);
      }
    });

    volumeSlider.addEventListener('input', () => {
      if (player && player.setVolume) {
        const vol = parseInt(volumeSlider.value);
        player.setVolume(vol);
        if (vol === 0) {
          muteBtn.textContent = '🔇';
          muteBtn.setAttribute('aria-pressed', 'true');
        } else {
          muteBtn.textContent = '🔊';
          muteBtn.setAttribute('aria-pressed', 'false');
        }
      }
    });

    muteBtn.addEventListener('click', () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        muteBtn.textContent = '🔊';
        muteBtn.setAttribute('aria-pressed', 'false');
        srAnnouncements.textContent = "Audio unmuted";
      } else {
        player.mute();
        muteBtn.textContent = '🔇';
        muteBtn.setAttribute('aria-pressed', 'true');
        srAnnouncements.textContent = "Audio muted";
      }
    });

    lyricsToggleBtn.addEventListener('click', () => {
      const isOpen = lyricsPanel.classList.toggle('open');
      lyricsToggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  </script>
</body>
</html>
