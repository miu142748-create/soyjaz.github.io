<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Check-In Design</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .pdf-container {
            position: relative;
            width: 100%;
            height: 60vh;
            min-height: 400px;
            max-height: 600px;
            border: 2px dashed #ff80df;
            background: #000000;
            border-radius: 4px;
            overflow: hidden;
        }
        @media screen and (max-width: 600px) {
            body {
                padding: 10px;
            }
            .box {
                padding: 15px;
            }
            .pdf-button {
                display: block;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="box" style="text-align: center;">
            <p style="margin: 0; color: #ff80df; font-weight: 700; font-size: 18px;">✨ Check-In Design ✨</p>
        </div>
        <div class="box">
            <div class="pdf-container">
                <iframe src="Check-In.pdf" width="100%" height="100%" style="border: none;"></iframe>
            </div>
            <div style="margin-top: 20px; text-align: center;">
                <a class="pdf-button" href="Check-In.pdf" target="_blank" aria-label="Open Check-In PDF in new tab" style="color: #ff80df; border: 1.5px solid #ff80df; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: 700; display: inline-block; font-size: 14px;">[ OPEN / DOWNLOAD CHECK-IN PDF ]</a>
            </div>
        </div>
        <div class="box" style="text-align: center; display: flex; justify-content: center; align-items: center; padding: 15px;">
            <p style="margin: 0; font-size: 12px; color: #ffffff; text-align: center; width: 100%;"><strong>Land Acknowledgement:</strong> Located on unceded Tohono O'Odham and Yoeme land</p>
        </div>
    </div>
</body>
</html>
