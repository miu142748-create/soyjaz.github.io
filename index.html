<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soyjaz.com</title>
  <style>
    /* Universal clean, consistent font and sizing across all devices */
    * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      box-sizing: border-box;
    }

    body {
      background-color: #ffe6f2;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    .glitter-container img {
      max-width: 100%;
      height: auto;
      margin: 5px;
    }

    /* Mobile-friendly PDF container */
    .pdf-box {
      background: #ffffff;
      border: 2px dashed #ff69b4;
      border-radius: 12px;
      padding: 15px;
      margin: 20px auto;
      max-width: 800px;
      width: 100%;
    }

    /* Big clickable mobile-first button */
    .pdf-button {
      display: inline-block;
      background-color: #ff1493;
      color: white;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(255, 20, 147, 0.4);
      margin-bottom: 15px;
      transition: background 0.2s;
    }

    .pdf-button:hover {
      background-color: #e00b82;
    }

    /* Responsive iframe wrapper so it scales on mobile screens */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 600px;
      background: #f9f9f9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .iframe-wrapper {
        height: 400px; /* Shorter height for mobile screens */
      }
    }
  </style>
</head>
<body>

  <!-- Header Graphic -->
  <div class="glitter-container">
    <div>
      <img src="http://dl9.glitter-graphics.net/pub/152/152179h4qroi8q2b.gif" width="500" height="60" alt="Glitter Graphics">
    </div>
    
    <!-- Glitter Text ("SOY JAZ") -->
    <div style="margin-top: 15px;">
      <img src="https://text.glitter-graphics.net/heart/s.gif" alt="S">
      <img src="https://text.glitter-graphics.net/heart/o.gif" alt="O">
      <img src="https://text.glitter-graphics.net/heart/y.gif" alt="Y">
      <img src="https://dl3.glitter-graphics.net/empty.gif" width="20" alt="">
      <img src="https://text.glitter-graphics.net/heart/j.gif" alt="J">
      <img src="https://text.glitter-graphics.net/heart/a.gif" alt="A">
      <img src="https://text.glitter-graphics.net/heart/z.gif" alt="Z">
    </div>
  </div>

  <!-- PDF Section with Mobile Button & Responsive Iframe -->
  <div class="pdf-box">
    <p style="margin-bottom: 15px; font-weight: bold; font-size: 16px; color: #333;">✨ Check out my PDF below! ✨</p>

    <!-- Fallback/Direct Action Button for Mobile Users -->
    <div>
      <a class="pdf-button" href="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/view?usp=sharing" target="_blank">
        Open PDF Document 📄
      </a>
    </div>

    <!-- Responsive Embedded Viewer -->
    <div class="iframe-wrapper">
      <iframe src="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/preview"></iframe>
    </div>
  </div>

  <!-- Footer Graphic -->
  <div style="text-align: center; margin: 30px 0;">
    <img src="http://dl8.glitter-graphics.net/pub/434/434518xlbzh5vtds.gif" width="15" height="13" alt="Footer Glitter">
  </div>

</body>
</html>
