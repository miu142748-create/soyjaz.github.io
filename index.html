<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOY JAZ</title>
    <style>
        body {
            background-color: #000000;
            background-image: url('http://dl3.glitter-graphics.net/pub/514/514873kwpj8sc5kp.gif');
            background-attachment: fixed;
            background-repeat: repeat;
            color: #ffffff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glitter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .glitter-container img {
            margin: 5px;
            height: 50px;
            width: auto;
        }

        /* Profile Picture Styling */
        .profile-pic-container {
            margin: 20px 0 10px 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px dashed #ff69b4;
            box-shadow: 0px 0px 15px #ff69b4;
        }

        /* Fully Transparent Container Box */
        .unified-pdf-container {
            background-color: transparent;
            border: none;
            box-shadow: none;
            padding: 25px;
            width: 90%;
            max-width: 950px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Text background style where there is text */
        .text-highlight {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px dashed #ff69b4;
            padding: 8px 18px;
            border-radius: 15px;
            color: #ff69b4;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0px 0px 10px #ff69b4;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .pdf-button {
            display: inline-block;
            background-color: #ff69b4;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.3s;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .pdf-button:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        /* PDF object viewer styling */
        object {
            border: 3px dashed #ff69b4;
            border-radius: 8px;
            background-color: white;
            width: 100%;
            max-width: 900px;
            height: 1250px;
            margin-top: 15px;
            box-shadow: 0px 0px 15px #ff69b4;
        }
    </style>
</head>
<body>

<!-- Header / Glitter Text ("SOY JAZ") -->
<div class="glitter-container">
    <div style="margin-top: 15px; display: flex; justify-content: center; align-items: center;">
        <img src="https://text.glitter-graphics.net/heart/s.gif" border="0" alt="S">
        <img src="https://text.glitter-graphics.net/heart/o.gif" border="0" alt="O">
        <img src="https://text.glitter-graphics.net/heart/y.gif" border="0" alt="Y">
        <img src="https://dl3.glitter-graphics.net/empty.gif" width="20" border="0" alt="">
        <img src="https://text.glitter-graphics.net/heart/j.gif" border="0" alt="J">
        <img src="https://text.glitter-graphics.net/heart/a.gif" border="0" alt="A">
        <img src="https://text.glitter-graphics.net/heart/z.gif" border="0" alt="Z">
    </div>
</div>

<!-- Profile Picture (Linked via Direct Google Drive Link) -->
<div class="profile-pic-container">
    <img src="https://lh3.googleusercontent.com/d/1lm5NxPdpJTOa9so6V3rQ5z98QSP8B_d8" alt="Jaz" class="profile-pic">
</div>

<!-- Transparent Box with text highlight -->
<div class="unified-pdf-container">
    <div class="text-highlight">✨ Check out my CV below! ✨</div>
    
    <!-- Embedded Google Drive PDF Object -->
    <object data="https://drive.google.com/file/d/1syiWk6LjFxcQeX8iib7n7JOSku9xWuCv/preview" type="application/pdf">
        <p>Your browser does not support PDFs. <a href="https://drive.google.com/file/d/1syiWk6LjFxcQeX8iib7n7JOSku9xWuCv/view?usp=sharing">Download the PDF</a>.</p>
    </object>

    <!-- Open PDF Document Button at the Bottom -->
    <a class="pdf-button" href="https://drive.google.com/file/d/1syiWk6LjFxcQeX8iib7n7JOSku9xWuCv/view?usp=sharing" target="_blank">
        Open PDF Document 📄
    </a>
</div>

<!-- Bottom Footer Graphic -->
<div style="text-align: center; margin: 30px 0; width: 100%;">
    <img src="http://dl8.glitter-graphics.net/pub/434/434518xlbzh5vtds.gif" width="15" height="13" border="0">
</div>

</body>
</html>
