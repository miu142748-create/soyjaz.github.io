<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOY JAZ</title>
    <style>
        body {
            background-color: #000000;
            background-image: url('https://www.glitter-graphics.com/graphics/1324');
            color: #ffffff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glitter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .glitter-container img {
            margin: 10px;
        }

        .pdf-box {
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px dashed #ff69b4;
            border-radius: 15px;
            padding: 25px;
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            color: #ff1493;
            box-shadow: 0px 0px 15px #ff69b4;
            text-align: center;
        }

        .pdf-button {
            display: inline-block;
            background-color: #ff69b4;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .pdf-button:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        iframe {
            border: 2px dashed #ff69b4;
            border-radius: 8px;
            background-color: white;
            width: 80vw;
            max-width: 800px;
            height: 600px;
            margin-top: 20px;
        }

        .iframe-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<!-- Banner / Header -->
<div class="glitter-container">
    <div>
        <img src="http://dl9.glitter-graphics.net/pub/152/152179h4qroi8q2b.gif" width="500" height="60" border="0" alt="Glitter Graphics">
    </div>
    
    <!-- Glitter Text ("SOY JAZ") -->
    <div style="margin-top: 15px; display: flex; justify-content: center; align-items: center;">
        <img src="https://text.glitter-graphics.net/heart/s.gif" border="0" alt="S">
        <img src="https://text.glitter-graphics.net/heart/o.gif" border="0" alt="O">
        <img src="https://text.glitter-graphics.net/heart/y.gif" border="0" alt="Y">
        <img src="https://dl3.glitter-graphics.net/empty.gif" width="20" border="0" alt="">
        <img src="https://text.glitter-graphics.net/heart/j.gif" border="0" alt="J">
        <img src="https://text.glitter-graphics.net/heart/a.gif" border="0" alt="A">
        <img src="https://text.glitter-graphics.net/heart/z.gif" border="0" alt="Z">
    </div>
</div>

<!-- PDF Section with Button -->
<div class="pdf-box">
    <p style="margin-bottom: 15px; font-weight: bold; font-size: 16px;">✨ Check out my PDF below! ✨</p>
    <a class="pdf-button" href="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/view?usp=sharing" target="_blank">
        Open PDF Document 📄
    </a>
</div>

<!-- Embedded PDF Viewer Frame -->
<div class="iframe-container">
    <iframe src="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/preview"></iframe>
</div>

<!-- Bottom Footer Graphic -->
<div style="text-align: center; margin: 30px 0; width: 100%;">
    <img src="http://dl8.glitter-graphics.net/pub/434/434518xlbzh5vtds.gif" width="15" height="13" border="0">
</div>

</body>
</html>
