<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soy jaz</title>
    <!-- Butterfly Favicon -->
    <link rel="icon" href="https://images.emojiterra.com/google/android-12l/512px/1f98b.png" type="image/png">
    <!-- Import More Legible Pixel Font (VT323) -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            /* Restored custom cursor image */
            cursor: url('http://dl3.glitter-graphics.net/pub/514/514873kwpj8sc5kp.gif'), auto;
            background-image: url('http://dl3.glitter-graphics.net/pub/514/514873kwpj8sc5kp.gif');
            background-attachment: fixed;
            background-repeat: repeat;
            font-family: 'VT323', monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
            font-size: 20px;
        }
        a, button {
            cursor: pointer;
        }
        .header-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            margin-left: auto;
            margin-right: auto;
            width: 90%;
            max-width: 850px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* Circle style */
            object-fit: cover;
            border: 2px dashed #ff69b4; /* Thinner dashed pink border */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        /* RPG Dialogue Box Style with Thinner Pink Dashed Borders */
        .bio-box {
            background: #0d001a;
            color: #fff;
            padding: 24px;
            border-radius: 12px;
            border: 2px dashed #ff69b4;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
            flex: 1;
            min-width: 280px;
            max-width: 600px;
            font-size: 24px;
            line-height: 1.4;
            text-align: left;
            position: relative;
        }
        /* Retro Dialogue Triangle/Pointer Effect */
        .bio-box::after {
            content: '▼';
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 14px;
            color: #ff69b4;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .content-box {
            margin-top: 25px;
            background: #0d001a;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #ff69b4;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
            display: inline-block;
            width: 90%;
            max-width: 850px;
            box-sizing: border-box;
        }
        .pdf-button {
            display: inline-block;
            background-color: #ff69b4;
            color: #0d001a;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 22px;
            font-family: 'VT323', monospace;
            border-radius: 8px;
            border: 2px dashed #fff;
            box-shadow: 4px 4px 0px #fff;
            margin-top: 15px;
            transition: transform 0.1s;
        }
        .pdf-button:hover {
            background-color: #fff;
            color: #ff1493;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #ff69b4;
        }
        .land-ack {
            margin-top: 25px;
            font-size: 20px;
            color: #fff;
            line-height: 1.4;
            background: #0d001a;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #ff69b4;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
            display: inline-block;
            width: 90%;
            max-width: 850px;
            margin-bottom: 35px;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Non-linked Glitter Text at the Very Top -->
    <div style="margin-top: 20px;">
        <img src="https://text.glitter-graphics.net/heart/s.gif" border="0"><img src="https://text.glitter-graphics.net/heart/o.gif" border="0"><img src="https://text.glitter-graphics.net/heart/y.gif" border="0"><img src="https://dl3.glitter-graphics.net/empty.gif" width="15" border="0"><img src="https://text.glitter-graphics.net/heart/j.gif" border="0"><img src="https://text.glitter-graphics.net/heart/a.gif" border="0"><img src="https://text.glitter-graphics.net/heart/z.gif" border="0">
    </div>

    <!-- Profile Section (Profile Picture & Dialogue Box Side-by-Side) -->
    <div class="header-section">
        <img src="pfp.png" alt="Profile Picture" class="profile-img">
        <div class="bio-box">
            <p style="margin: 0;">Hello and welcome! My name is jazzie terrell and I'm a PhD student in Rhetoric, Composition, and the Teaching of English.</p>
        </div>
    </div>

    <!-- CV Button Section -->
    <div class="content-box">
        <p style="margin-bottom: 8px; font-size: 22px; color: #ff69b4;">✨ Check out my CV below! ✨</p>
        
        <a class="pdf-button" href="terrell-cv.pdf" target="_blank">
            [ OPEN CV DOCUMENT ]
        </a>
    </div>

    <!-- Land Acknowledgement Section -->
    <div>
        <div class="land-ack">
            <p style="margin: 0;"><strong>Land Acknowledgement:</strong> Located on the unceded Tohono O'Odham and Yoeme land.</p>
        </div>
    </div>

</body>
</html>
