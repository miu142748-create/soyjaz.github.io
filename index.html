<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOY JAZ</title>
    <!-- Import Google Font for cross-device consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('http://dl3.glitter-graphics.net/pub/514/514873kwpj8sc5kp.gif');
            background-attachment: fixed;
            background-repeat: repeat;
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .pdf-box {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            width: 80%;
            max-width: 800px;
        }
        .pdf-button {
            display: inline-block;
            background-color: #ff69b4;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Quicksand', sans-serif;
        }
        .pdf-button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

    <!-- Clean Heading -->
    <h1 style="color: #ff1493; font-size: 42px; font-weight: 700; text-shadow: 2px 2px 4px #ffffff; margin-top: 40px;">SOY JAZ</h1>

    <!-- PDF Section with Button and Preview -->
    <div class="pdf-box">
        <p style="margin-bottom: 15px; font-weight: 700; font-size: 16px; color: #333;">✨ Check out my PDF below! ✨</p>
        
        <a class="pdf-button" href="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/view?usp=sharing" target="_blank">
            Open PDF Document 📄
        </a>
        
        <div style="margin-top: 20px;">
            <iframe src="https://drive.google.com/file/d/1aG1bavvp7FZw7ZOkGEw140BwKlAzueqi/preview" width="100%" height="600px" style="border: 2px dashed #ff69b4; border-radius: 8px;"></iframe>
        </div>
    </div>

</body>
</html>
